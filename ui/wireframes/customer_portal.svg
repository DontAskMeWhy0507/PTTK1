  <text x="40" y="240" font-size="18" font-weight="bold">Nhà cho thuê nổi bật</text>

  <!-- Item 1 -->
  <rect x="40" y="260" width="280" height="300" rx="12" fill="white" stroke="#e2e8f0"/>
  <rect x="40" y="260" width="280" height="160" rx="12" fill="#cbd5e0"/> <!-- Image placeholder -->
  <text x="60" y="445" font-weight="bold">Nhà riêng Nguyên Căn</text>
  <text x="60" y="470" font-size="12" fill="#718096">Quận 1, TP.HCM • 45m2</text>
  <text x="60" y="500" font-size="16" font-weight="bold" fill="#3182ce">15.000.000đ / tháng</text>
  <rect x="60" y="520" width="240" height="30" rx="6" fill="#3182ce"/>
  <text x="125" y="540" fill="white" font-size="12" font-weight="bold">Đặt lịch xem nhà</text>

  <!-- Item 2 -->
  <rect x="360" y="260" width="280" height="300" rx="12" fill="white" stroke="#e2e8f0"/>
  <rect x="360" y="260" width="280" height="160" rx="12" fill="#cbd5e0"/>
  <text x="380" y="445" font-weight="bold">Chung cư Vinhomes</text>
  <text x="380" y="470" font-size="12" fill="#718096">Gia Lâm, Hà Nội • 75m2</text>
  <text x="380" y="500" font-size="16" font-weight="bold" fill="#3182ce">12.000.000đ / tháng</text>
