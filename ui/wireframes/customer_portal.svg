  <!-- Member Benefits info -->
  <rect x="40" y="600" width="920" height="150" rx="12" fill="#ebf8ff" stroke="#bee3f8"/>
  <text x="70" y="640" font-size="18" font-weight="bold" fill="#2c5282">Đăng ký thành viên để xem thông tin chi tiết!</text>
  <text x="70" y="670" fill="#2c5282">Xem chính xác địa chỉ, số điện thoại chủ nhà và nhận hỗ trợ ưu tiên từ môi giới.</text>
  <rect x="70" y="690" width="150" height="40" rx="8" fill="#2c5282"/>
  <text x="95" y="715" fill="white" font-weight="bold">Đăng ký ngay</text>
